<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" class="brand__seal" aria-hidden="true">
  <title>EduSphere — The Paper Archive</title>
  <defs>
    <clipPath id="esTorn">
      <path d="M6 5 L18 3.5 L31 5.5 L44 3.5 L56 5.5 L58.5 17 L57 30 L59 42 L57 54 L58 59 L45 60.5 L32 58.5 L19 60.5 L6 58.5 L5 47 L6.5 35 L4.5 23 L6 12 Z"/>
    </clipPath>
    <linearGradient id="esPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#dfd2b6"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#esTorn)">
    <!-- ink-black, torn-edge stamp -->
    <rect width="64" height="64" fill="#171612"/>
    <rect x="4.5" y="4.5" width="55" height="55" fill="none" stroke="#f0e6cf" stroke-width="1.1" opacity=".5"/>
    <!-- cinema film-strip perforations -->
    <g fill="#f0e6cf" opacity=".82">
      <rect x="8.5" y="12" width="4" height="4" rx="1"/>
      <rect x="8.5" y="24" width="4" height="4" rx="1"/>
      <rect x="8.5" y="36" width="4" height="4" rx="1"/>
      <rect x="8.5" y="48" width="4" height="4" rx="1"/>
      <rect x="51.5" y="12" width="4" height="4" rx="1"/>
      <rect x="51.5" y="24" width="4" height="4" rx="1"/>
      <rect x="51.5" y="36" width="4" height="4" rx="1"/>
      <rect x="51.5" y="48" width="4" height="4" rx="1"/>
    </g>
    <!-- a filed stack of question papers, with a turned corner -->
    <g transform="rotate(-7 32 32)">
      <rect x="17" y="17" width="30" height="34" rx="1" fill="#a98a60"/>
      <rect x="15" y="14" width="30" height="34" rx="1" fill="#c9a977"/>
      <rect x="13" y="11" width="30" height="34" rx="1" fill="url(#esPaper)"/>
      <path d="M35 11 L43 11 L43 19 Z" fill="#d8c7a4"/>
      <path d="M35 11 L35 19 L43 19 Z" fill="#b7a37a"/>
      <g stroke="#171612" stroke-width="1.5" stroke-linecap="round" opacity=".72">
        <path d="M18 22 H36"/>
        <path d="M18 27 H34"/>
        <path d="M18 32 H36"/>
        <path d="M18 37 H29"/>
      </g>
    </g>
    <!-- rust-red wax filing seal with the E monogram -->
    <circle cx="45" cy="45" r="10.5" fill="#a1482c" stroke="#fbf6ea" stroke-width="1.7"/>
    <circle cx="45" cy="45" r="7.4" fill="none" stroke="#fbf6ea" stroke-width=".7" opacity=".6"/>
    <text x="45" y="49.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#fbf6ea">E</text>
    <!-- a small amber cinema spark -->
    <path d="M32 5 L33.1 7.9 L36 9 L33.1 10.1 L32 13 L30.9 10.1 L28 9 L30.9 7.9 Z" fill="#e8a43c"/>
  </g>
</svg>
